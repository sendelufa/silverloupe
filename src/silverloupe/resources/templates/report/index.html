<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silverloupe review</title>
  <link rel="stylesheet" href=".silverloupe-report/previews.css">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 1120px; padding: 2rem; line-height: 1.45; }
    header, section { margin-bottom: 2rem; }
    .status { display: inline-block; padding: .3rem .7rem; border: 1px solid currentColor; border-radius: 999px; }
    .disclosure { padding: 1rem; border-left: .3rem solid #c27b00; background: color-mix(in srgb, #c27b00 12%, transparent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    article { border: 1px solid #8886; border-radius: .6rem; padding: 1rem; overflow-wrap: anywhere; }
    .preview { display: block; width: 100%; height: 180px; background-color: #111; background-position: center; background-repeat: no-repeat; background-size: contain; margin-bottom: .8rem; }
    dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; margin: .6rem 0 0; }
    dt { font-weight: 650; margin-top: .5rem; } dd { margin: 0; }
    .empty { opacity: .7; font-style: italic; }
    code { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Silverloupe review</h1>
    {{SUMMARY}}
  </header>
  {{DISCLOSURE}}
  {{SECTIONS}}
  {{AUDIT}}
</body>
</html>
