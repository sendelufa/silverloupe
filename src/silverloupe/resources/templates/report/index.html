<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silverloupe review</title>
  <link rel="stylesheet" href=".silverloupe-report/previews.css">
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #111214; color: #eeefef; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.45; }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem 1.5rem; padding: 1.1rem clamp(1rem, 2vw, 2rem); border-bottom: 1px solid #33363a; }
    h1 { margin: 0; font-size: 1.15rem; letter-spacing: .04em; }
    header p { margin: 0; color: #a3a7ac; font-size: .8rem; }
    .status { color: #d6dbd9; }
    main { padding: 0 clamp(1rem, 2vw, 2rem) 3rem; }
    section { margin: 2rem 0; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .8rem; }
    .disclosure { padding: .85rem 1rem; border-left: 2px solid #d4a767; background: #29241d; font-size: .85rem; }
    .disclosure h2, .disclosure p { margin: 0; }
    .disclosure h2 { margin-bottom: .3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: .65rem; }
    article { min-width: 0; background: #1b1d20; border-radius: .35rem; overflow: hidden; overflow-wrap: anywhere; align-self: start; }
    .preview { display: block; width: 100%; aspect-ratio: 4 / 3; border: 0; padding: 0; background-color: #202226; background-position: center; background-repeat: no-repeat; background-size: contain; cursor: zoom-in; }
    .preview:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #e3bd83; outline-offset: -2px; }
    .metadata { font-size: .8rem; color: #c8cbce; }
    .metadata summary { cursor: pointer; padding: .55rem .7rem; color: #aeb3b7; }
    .alternatives > summary { cursor: pointer; padding: .55rem .7rem; color: #d3b88d; font-size: .8rem; border-top: 1px solid #34363a; }
    .alternative-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: .4rem; padding: .4rem; background: #101113; }
    .choose-alternative { width: 100%; padding: .6rem; border: 0; background: #dfc49c; color: #1d1a15; font-weight: 650; cursor: pointer; }
    .choose-alternative:disabled { opacity: .6; cursor: wait; }
    .metadata h3 { margin: 0; padding: .2rem .7rem; color: #eee; font-size: .9rem; }
    dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: .2rem; margin: 0; padding: .2rem .7rem .8rem; }
    dt { font-weight: 650; margin-top: .5rem; } dd { margin: 0; }
    .empty { opacity: .7; font-style: italic; }
    code { white-space: pre-wrap; }
    .audit { color: #aaa; font-size: .8rem; }
    dialog { width: 100vw; max-width: none; height: 100dvh; max-height: none; padding: 0; border: 0; background: #090a0bea; color: #fff; }
    dialog::backdrop { background: #000d; }
    .viewer { display: flex; flex-direction: column; height: 100%; }
    .viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .75rem 1rem; }
    .viewer-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .close-viewer { border: 1px solid #777; border-radius: .35rem; background: #24262a; color: inherit; padding: .45rem .8rem; cursor: pointer; }
    .viewer-image { flex: 1; min-height: 0; background-position: center; background-repeat: no-repeat; background-size: contain; }
  </style>
</head>
<body data-revision="{{REVISION}}">
  <header>
    <h1>Silverloupe review</h1>
    {{SUMMARY}}
  </header>
  <main>
    {{DISCLOSURE}}
    {{SECTIONS}}
    <div class="audit">{{AUDIT}}</div>
  </main>
  <dialog id="viewer" aria-label="Image viewer">
    <div class="viewer">
      <div class="viewer-bar"><span class="viewer-name"></span><button class="close-viewer" type="button" aria-label="Close image">Close ✕</button></div>
      <div class="viewer-image" role="img"></div>
    </div>
  </dialog>
  <script>
    const viewer = document.getElementById("viewer");
    const viewerImage = viewer.querySelector(".viewer-image");
    const viewerName = viewer.querySelector(".viewer-name");
    document.addEventListener("click", (event) => {
      const preview = event.target.closest("button.preview");
      if (!preview) return;
      viewerImage.style.backgroundImage = getComputedStyle(preview).backgroundImage;
      viewerImage.setAttribute("aria-label", preview.dataset.filename);
      viewerName.textContent = preview.dataset.filename;
      viewer.showModal();
    });
    viewer.querySelector(".close-viewer").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", (event) => { if (event.target === viewer) viewer.close(); });
    document.addEventListener("click", async (event) => {
      const choice = event.target.closest(".choose-alternative");
      if (!choice) return;
      if (location.protocol === "file:") {
        alert("To save a replacement, open the interactive report with: silverloupe review OUTPUT");
        return;
      }
      choice.disabled = true;
      try {
        const response = await fetch("replace", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({original: choice.dataset.original, alternate: choice.dataset.alternate,
            scope: choice.dataset.scope, revision: Number(document.body.dataset.revision)})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not save the selection");
        location.reload();
      } catch (error) {
        alert(error.message);
        choice.disabled = false;
      }
    });
  </script>
</body>
</html>
