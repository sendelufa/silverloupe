[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "silverloupe"
version = "0.1.0"
description = "Deterministic core contracts and tools for assisted photo culling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
raw = ["rawpy>=0.25,<1"]

[project.scripts]
silverloupe = "silverloupe.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
silverloupe = ["resources/profiles/*.json", "resources/templates/report/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src", "."]
testpaths = ["tests"]
